[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpress-to-markdown"
version = "0.1.0"
description = "Export WordPress posts to Markdown with configurable metadata and output modes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "markdownify>=1.2.0",
  "PyYAML>=6.0.2",
  "requests>=2.31",
]

[project.scripts]
wordpress-to-markdown = "wordpress_to_markdown.cli:main"

[project.urls]
Repository = "https://github.com/Aues12/wordpress-to-markdown"
Issues = "https://github.com/Aues12/wordpress-to-markdown/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "build>=1.2", "twine>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
