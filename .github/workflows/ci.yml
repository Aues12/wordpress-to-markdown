name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10
        if: matrix.installer == 'uv'
      - name: Install with pip
        if: matrix.installer == 'pip'
        run: python -m pip install '.[dev]'
      - name: Install with uv
        if: matrix.installer == 'uv'
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Test with pip
        if: matrix.installer == 'pip'
        run: python -m pytest
      - name: Test with uv
        if: matrix.installer == 'uv'
        run: uv run --locked --extra dev --python ${{ matrix.python-version }} python -m pytest

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside repository
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -c 'import wordpress_to_markdown; import wordpress_to_markdown.cli; import wordpress_to_markdown.commanding'
          "$RUNNER_TEMP/wheel-check/bin/wordpress-to-markdown" --help
          "$RUNNER_TEMP/wheel-check/bin/python" -m wordpress_to_markdown --help
